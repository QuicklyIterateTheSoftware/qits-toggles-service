# qits-toggles domain defaults, shipped from this library jar at ordinal 100. The deployable's
# application.properties (250) and the environment (300) override any of them.
#
# THE PLATFORM'S GENERIC RESOURCE CONTRACT. .config/qits/deployments.yml declares
# `postgresql:db:qits_toggles`; qits-deployments creates the role and the database before the
# container starts and injects QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD. No defaults, on purpose:
# an unset variable fails the boot at Flyway naming what is missing, rather than opening some store
# nobody meant. The suite supplies the values (service/src/test/.../testdb/EmbeddedPgConfigSource).
quarkus.datasource.toggles.db-kind=postgresql
quarkus.datasource.toggles.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.toggles.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.toggles.password=${QITS_RESOURCE_DB_PASSWORD}

# THE POOL SURVIVES A POSTGRES CUTOVER. All three lines or none: DatasourceBaselineTest fails the
# build if one goes missing.
quarkus.datasource.toggles.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.toggles.jdbc.acquisition-timeout=15S
quarkus.datasource.toggles.jdbc.validate-on-borrow=true

# Own Flyway lineage, hand-written and appended to. No baseline-on-migrate: every database this
# lineage meets is empty or was created by it. `schemas` makes Flyway create the schema and keep
# its history table there.
#
# No persistence unit: the stores read and write by plain JDBC.
quarkus.flyway.toggles.migrate-at-start=true
quarkus.flyway.toggles.schemas=toggles
quarkus.flyway.toggles.locations=classpath:db/toggles/migration
